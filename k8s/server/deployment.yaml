apiVersion: apps/v1
kind: Deployment
metadata:
  name: holdem-server
  namespace: holdem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: holdem-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: holdem-server
    spec:
      serviceAccountName: holdem-server-sa
      containers:
        - name: holdem-server
          image: 026951011097.dkr.ecr.ap-northeast-2.amazonaws.com/holdem-server:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: holdem-secret
                  key: REDIS_HOST
            - name: REDIS_PORT
              value: "6379"
            - name: PORT
              value: "3001"
            - name: HISTORY_BUCKET
              value: holdem-history-026951011097
            - name: AWS_REGION
              value: ap-northeast-2
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
