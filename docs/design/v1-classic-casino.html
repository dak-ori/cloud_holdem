<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cloud Hold'em — Classic Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #1a5c3a 0%, #0e3b24 55%, #072415 100%);
    color: #f3ead0;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 20px;
    position: relative;
    overflow: hidden;
  }
  .suits {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
    font-size: 120px; color: #f3ead0; line-height: 1.6;
    text-align: center; letter-spacing: 40px;
    transform: rotate(-12deg) scale(1.4); top: -40px;
  }
  .wrap { width: 100%; max-width: 520px; position: relative; }
  .crest { text-align: center; margin-bottom: 8px; font-size: 28px; color: #d8b24a; letter-spacing: 12px; }
  h1 {
    font-family: 'Playfair Display', serif;
    text-align: center; font-size: 44px; font-weight: 800;
    color: #f6e7b2;
    text-shadow: 0 2px 14px rgba(0,0,0,.45);
    letter-spacing: 2px;
  }
  .sub { text-align: center; color: #cdbd8d; font-size: 13px; letter-spacing: 6px; margin-top: 6px; margin-bottom: 34px; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 0 auto 34px; max-width: 320px; color: #d8b24a; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #b98f2f); }
  .divider::after { background: linear-gradient(90deg, #b98f2f, transparent); }
  .panel {
    background: linear-gradient(180deg, rgba(10,30,18,.92), rgba(7,22,13,.96));
    border: 1px solid #b98f2f;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(246,231,178,.12);
    padding: 26px;
    margin-bottom: 22px;
  }
  .panel h3 { font-size: 13px; letter-spacing: 4px; color: #d8b24a; margin-bottom: 16px; font-weight: 700; }
  input {
    width: 100%; padding: 14px 16px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(216,178,74,.4); border-radius: 8px;
    color: #f3ead0; font-size: 16px; font-family: inherit;
  }
  input::placeholder { color: #8a9a83; }
  .btn-primary {
    width: 100%; margin-top: 14px; padding: 15px;
    background: linear-gradient(180deg, #e3c264, #b98f2f);
    color: #2a1f06; font-weight: 700; font-size: 16px; letter-spacing: 2px;
    border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(216,178,74,.35);
  }
  .room {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid rgba(216,178,74,.18);
  }
  .room:last-child { border-bottom: none; }
  .room .names { font-size: 15px; }
  .room .count { color: #d8b24a; font-size: 13px; margin-right: 14px; }
  .btn-join {
    padding: 8px 22px; background: transparent;
    border: 1px solid #d8b24a; color: #e3c264; border-radius: 6px;
    font-size: 13px; letter-spacing: 2px; cursor: pointer; font-family: inherit;
  }
  .full { opacity: .35; }
  .foot { text-align: center; color: #7d8f76; font-size: 12px; letter-spacing: 3px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="suits">♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣</div>
  <div class="wrap">
    <div class="crest">♠ ♥ ♦ ♣</div>
    <h1>Cloud Hold'em</h1>
    <div class="sub">PRIVATE POKER ROOM</div>
    <div class="divider">❖</div>

    <div class="panel">
      <h3>입장하기</h3>
      <input placeholder="닉네임 입력 (최대 12자)">
      <button class="btn-primary">방 만들기</button>
    </div>

    <div class="panel">
      <h3>진행 중인 테이블</h3>
      <div class="room">
        <span class="names">철수, 영희</span>
        <span><span class="count">2 / 4</span><button class="btn-join">입장</button></span>
      </div>
      <div class="room">
        <span class="names">민준, 서연, 도윤</span>
        <span><span class="count">3 / 4</span><button class="btn-join">입장</button></span>
      </div>
      <div class="room full">
        <span class="names">지우, 하준, 수아, 예준</span>
        <span><span class="count">4 / 4</span><button class="btn-join">만석</button></span>
      </div>
    </div>
    <div class="foot">4인 텍사스 홀덤 · 닉네임만으로 즉시 플레이</div>
  </div>
</body>
</html>
